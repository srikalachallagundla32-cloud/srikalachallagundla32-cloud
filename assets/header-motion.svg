<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SRIKALA // CYBER ARCHITECT">
  <defs>
    <radialGradient id="void" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="55%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      @keyframes pulse   { 0% { transform: scale(.55); opacity: .7 } 100% { transform: scale(1.9); opacity: 0 } }
      @keyframes spin    { to { transform: rotate(360deg) } }
      @keyframes spinRev { to { transform: rotate(-360deg) } }
      @keyframes glow    { 0%,100% { opacity: .8 } 50% { opacity: 1 } }
      .star  { animation: twinkle 3s ease-in-out infinite }
      .ring  { transform-origin: 600px 160px; transform-box: view-box; animation: pulse 4s ease-out infinite }
      .orbitA { transform-origin: 600px 160px; transform-box: view-box; animation: spin 16s linear infinite }
      .orbitB { transform-origin: 600px 160px; transform-box: view-box; animation: spinRev 22s linear infinite }
      .title  { animation: glow 3.5s ease-in-out infinite }
      /* Accessibility: honor the OS "reduce motion" setting. */
      @media (prefers-reduced-motion: reduce) {
        .star, .ring, .orbitA, .orbitB, .title { animation: none }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#void)"/>
  <ellipse cx="600" cy="160" rx="360" ry="150" fill="url(#core)"/>

  <!-- starfield -->
  <g fill="#e2e8f0">
    <circle class="star" cx="120" cy="60"  r="1.6" style="animation-delay:0s"/>
    <circle class="star" cx="240" cy="240" r="1.2" style="animation-delay:.6s" fill="#38bdf8"/>
    <circle class="star" cx="330" cy="90"  r="1.8" style="animation-delay:1.2s"/>
    <circle class="star" cx="90"  cy="180" r="1.3" style="animation-delay:1.8s" fill="#c084fc"/>
    <circle class="star" cx="180" cy="130" r="1.0" style="animation-delay:2.2s"/>
    <circle class="star" cx="420" cy="200" r="1.5" style="animation-delay:.3s" fill="#38bdf8"/>
    <circle class="star" cx="500" cy="70"  r="1.2" style="animation-delay:1.5s"/>
    <circle class="star" cx="700" cy="255" r="1.6" style="animation-delay:.9s" fill="#c084fc"/>
    <circle class="star" cx="780" cy="80"  r="1.1" style="animation-delay:2.6s"/>
    <circle class="star" cx="880" cy="210" r="1.7" style="animation-delay:.5s" fill="#38bdf8"/>
    <circle class="star" cx="960" cy="120" r="1.3" style="animation-delay:1.9s"/>
    <circle class="star" cx="1050" cy="70" r="1.5" style="animation-delay:1.1s" fill="#c084fc"/>
    <circle class="star" cx="1110" cy="230" r="1.2" style="animation-delay:2.3s"/>
    <circle class="star" cx="1020" cy="250" r="1.0" style="animation-delay:.7s"/>
    <circle class="star" cx="640" cy="40"  r="1.3" style="animation-delay:1.4s" fill="#e879f9"/>
    <circle class="star" cx="560" cy="270" r="1.4" style="animation-delay:2.0s"/>
    <circle class="star" cx="300" cy="270" r="1.1" style="animation-delay:.4s" fill="#38bdf8"/>
    <circle class="star" cx="150" cy="270" r="1.5" style="animation-delay:1.7s"/>
    <circle class="star" cx="450" cy="40"  r="1.2" style="animation-delay:2.5s" fill="#c084fc"/>
    <circle class="star" cx="900" cy="55"  r="1.4" style="animation-delay:.2s"/>
  </g>

  <!-- glowing pulse rings -->
  <circle class="ring" cx="600" cy="160" r="70" fill="none" stroke="#c084fc" stroke-width="2"/>
  <circle class="ring" cx="600" cy="160" r="70" fill="none" stroke="#38bdf8" stroke-width="2" style="animation-delay:1.3s"/>
  <circle class="ring" cx="600" cy="160" r="70" fill="none" stroke="#e879f9" stroke-width="2" style="animation-delay:2.6s"/>

  <!-- orbital paths + orbiting bodies -->
  <ellipse cx="600" cy="160" rx="330" ry="120" fill="none" stroke="#c084fc" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="600" cy="160" rx="240" ry="80"  fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>
  <g class="orbitA">
    <circle cx="930" cy="160" r="6" fill="#38bdf8" filter="url(#soft)"/>
    <circle cx="930" cy="160" r="3" fill="#e2e8f0"/>
  </g>
  <g class="orbitB">
    <circle cx="360" cy="160" r="5" fill="#e879f9" filter="url(#soft)"/>
    <circle cx="360" cy="160" r="2.5" fill="#ffffff"/>
  </g>

  <!-- title -->
  <g class="title" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace">
    <text x="600" y="150" font-size="46" font-weight="bold" fill="#e2e8f0" filter="url(#soft)" opacity="0.6">SRIKALA // CYBER ARCHITECT</text>
    <text x="600" y="150" font-size="46" font-weight="bold" fill="#c084fc">SRIKALA // CYBER ARCHITECT</text>
    <text x="600" y="192" font-size="17" fill="#38bdf8" letter-spacing="3">Go Systems · AST Analysis · Cloud FinOps Theater</text>
  </g>
</svg>
